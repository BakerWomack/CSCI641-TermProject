filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    json.keys_under_root: true
    json.add_error_key: true
    fields:
      service: web-server-pep
      log_type: nginx_access
    fields_under_root: true

output.elasticsearch:
  enabled: false

output.http:
  enabled: true
  hosts: ["http://splunk:8088"]
  path: "/services/collector/event"
  headers:
    Authorization: "Splunk security-hec-token"
  codec.format:
    string: '{"event": %{[message]}, "sourcetype": "_json"}'
